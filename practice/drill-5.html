<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Drill 5</title>
</head>
<body>
  <h1>Send a message to the sacco</h1>
  
  <form action="#" method="post">
    <label for="full-name">Your name</label>
    <input type="text" id="full-name" name="full_name" required>

    <label for="phone-number">Your phone number</label>
    <input type="tel" id="phone-number" name="phone" pattern="07[0-9]{8}" title="Ten digits starting with 07" placeholder="07XXXXXXXX" required>

    <label for="user-message">Your message</label>
    <textarea id="user-message" name="message" rows="5" required></textarea>

    <button type="submit">Send message</button>
  </form>
</body>
</html>
